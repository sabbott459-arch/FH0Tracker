name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      # One permanent signing key stored as an encrypted repository secret.
      # Never generate a new key on a GitHub-hosted runner.
      - name: Restore fixed Android signing key
        env:
          FH0_SIGNING_KEYSTORE_B64: ${{ secrets.FH0_SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$FH0_SIGNING_KEYSTORE_B64" ]; then
            echo "::error::Missing FH0_SIGNING_KEYSTORE_B64 GitHub Actions secret. See android/SIGNING.md."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$FH0_SIGNING_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -v | grep SHA256
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FH0Tracker-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: FH0Tracker Android build ${{ github.run_number }}
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
