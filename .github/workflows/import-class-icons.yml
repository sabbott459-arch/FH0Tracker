name: Import Frosthaven class artwork
on:
  workflow_dispatch:
  push:
    paths:
      - 'cloud.js'
permissions:
  contents: write
jobs:
  import-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all 17 icons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/classes
          declare -A icons=(
            [banner-spear]=banner-spear [blinkblade]=blinkblade [boneshaper]=boneshaper
            [deathwalker]=deathwalker [drifter]=drifter [geminate]=geminate
            [astral]=infuser [coral]=crashing-tide [drill]=metal-mosaic
            [fist]=frozen-fist [kelp]=deepwraith [meteor]=pyroclast
            [prism]=hive [shackles]=pain-conduit [shards]=shattersong
            [snowflake]=snowdancer [trap]=trapper
          )
          for id in "${!icons[@]}"; do
            curl --fail --location --retry 3 --silent --show-error \
              "https://raw.githubusercontent.com/any2cards/worldhaven/master/images/art/frosthaven/icons/characters/fh-${icons[$id]}-bw-icon.png" \
              --output "assets/classes/$id.png"
            test "$(stat -c%s "assets/classes/$id.png")" -gt 1000
          done
          test "$(find assets/classes -name '*.png' | wc -l)" -eq 17
      - name: Download all 17 perk sheets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/perks
          declare -A sheets=(
            [banner-spear]=banner-spear [blinkblade]=blinkblade [boneshaper]=boneshaper
            [deathwalker]=deathwalker [drifter]=drifter [geminate]=geminate
            [astral]=infuser [coral]=crashing-tide [drill]=metal-mosaic
            [fist]=frozen-fist [kelp]=deepwraith [meteor]=pyroclast
            [prism]=hive [shackles]=pain-conduit [shards]=shattersong
            [snowflake]=snowdancer [trap]=trapper
          )
          for id in "${!sheets[@]}"; do
            curl --fail --location --retry 3 --silent --show-error \
              "https://raw.githubusercontent.com/any2cards/worldhaven/master/images/character-perks/frosthaven/fh-${sheets[$id]}-perks.png" \
              --output "assets/perks/$id.png"
            test "$(stat -c%s "assets/perks/$id.png")" -gt 1000
          done
          test "$(find assets/perks -name '*.png' | wc -l)" -eq 17
      - name: Download Frosthaven UI symbols
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/symbols
          for entry in condition/poison condition/wound condition/stun condition/disarm condition/muddle condition/immobilize condition/brittle condition/strengthen condition/invisible condition/ward condition/regenerate condition/curse condition/bless element/air element/earth element/fire element/ice element/light element/dark attackmodifier/rolling action/heal action/shield action/pierce action/push action/pull action/target action/range; do
            name="${entry//\//-}"
            curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/Lurkars/gloomhavensecretariat/main/src/assets/images/${entry}.svg" --output "assets/symbols/${name}.svg"
          done
      - name: Commit local artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/classes assets/perks assets/symbols
          if ! git diff --cached --quiet; then
            git commit -m "Vendor Frosthaven class icons locally"
            git push
          fi
